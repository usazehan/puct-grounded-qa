services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: puctqa
      POSTGRES_PASSWORD: puctqa
      POSTGRES_DB: puctqa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puctqa -d puctqa"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn puctqa.api:app --host 0.0.0.0 --port 8000
    environment:
      PUCTQA_DSN: postgresql://puctqa:puctqa@db:5432/puctqa
      PUCTQA_BACKEND: ${PUCTQA_BACKEND:-echo}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORPUS_DIR: /app/data/raw
      SOURCE_HTTP_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src

volumes:
  pgdata:
